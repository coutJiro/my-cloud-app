<div id="app-root">
  <header>
    <h1>🚛 Station Queue Monitor</h1>
    <p>Live data from Shopee In‑Station</p>
    <button id="refresh-btn" style="background:#4CAF50;">⟳ Refresh</button>
  </header>

  <div class="dashboard">
    <div class="column perimeter">
      <h2>🟢 Perimeter</h2>
      <div class="list" id="perimeter-list">
        <p class="placeholder">Waiting for data…</p>
      </div>
    </div>
    <div class="column ongoing">
      <h2>🟠 On Going</h2>
      <div class="list" id="ongoing-list">
        <p class="placeholder">Waiting for data…</p>
      </div>
    </div>
    <div class="column ended">
      <h2>🔴 Ended</h2>
      <div class="list" id="ended-list">
        <p class="placeholder">Waiting for data…</p>
      </div>
    </div>
  </div>

  <footer>
    <small>Last updated: <span id="timestamp">—</span></small>
  </footer>
</div>
